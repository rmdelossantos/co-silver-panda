# Run the production image locally:  docker compose up --build   →  http://localhost:3000
name: product-catalog

services:
  app:
    build:
      context: .
      target: runtime
    image: product-catalog:local
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      # Only needed if the UI is served from a different origin than the API.
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      # Optional: set to turn on "Suggest with AI" in the product form.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
    volumes:
      - catalog-data:/data
    restart: unless-stopped

volumes:
  catalog-data:
